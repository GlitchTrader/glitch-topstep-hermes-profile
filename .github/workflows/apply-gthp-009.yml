name: apply-gthp-009

on:
  push:
    branches:
      - architect/gthp-009-cognition-authority

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/gthp-009-cognition-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_gthp_009.py
      - run: |
          python -m py_compile scripts/*.py plugins/topstep-control/__init__.py
          python -m unittest discover -s tests -p 'test_*.py'
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md SOUL.md distribution.yaml docs/AUTHORITY.md docs/ledger/ledger.json docs/specs/GTHP-009.md scripts/run-topstep-cycle.py tests/test_direct_cycle.py SHA256SUMS
          git diff --cached --quiet && exit 1
          git commit -m "fix(cognition): keep flat evidence in Hermes judgment"
          git push origin HEAD:architect/gthp-009-cognition-authority
