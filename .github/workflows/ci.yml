name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/*.py plugins/topstep-control/__init__.py
      - run: python scripts/check_profile_quality.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate SHA256SUMS
        run: python -c "from pathlib import Path; import sys; sys.path.insert(0,'scripts'); from distribution_manifest import verify_sha256sums; errors=verify_sha256sums(Path('.')); assert not errors, errors"
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('operator.json').read_text())
          print('operator.json valid')
          PY

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install tzdata
      - run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('*.py')]; py_compile.compile('plugins/topstep-control/__init__.py', doraise=True)"
      - run: python scripts/check_profile_quality.py
      - name: unittest (windows)
        shell: cmd
        run: python -m unittest discover -s tests -p "test_*.py"
