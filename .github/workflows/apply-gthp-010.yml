name: apply-gthp-010

on:
  push:
    branches:
      - architect/gthp-010-compatibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/gthp-010-compatibility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_gthp_010.py
      - run: |
          python -m py_compile scripts/*.py plugins/topstep-control/__init__.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit verified product change and remove one-shot machinery
        run: |
          rm -f tools/apply_gthp_010.py .github/workflows/apply-gthp-010.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(release): enforce gateway profile compatibility"
          git push origin HEAD:architect/gthp-010-compatibility
