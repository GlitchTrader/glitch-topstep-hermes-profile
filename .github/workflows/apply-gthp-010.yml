name: apply-gthp-010

on:
  pull_request:
  push:
    branches:
      - architect/gthp-010-compatibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/gthp-010-compatibility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Narrow the status-only exact rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_gthp_010.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)
          '''.replace('          ', '')
          helper = '''

          def replace_first(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"{label}: expected at least one match")
              return text.replace(old, new, 1)
          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('replace_once helper anchor mismatch')
          text = text.replace(anchor, anchor + helper, 1)
          target = '''plugin = replace_once(
              plugin,
              "    mode = str(health.get(\\\"trading_mode\\\") or \\\"unknown\\\")\\n",
          '''.replace('          ', '')
          if text.count(target) != 1:
              raise SystemExit(f'status rewrite call anchor mismatch: {text.count(target)}')
          text = text.replace(target, target.replace('replace_once', 'replace_first', 1), 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: python tools/apply_gthp_010.py
      - run: |
          python -m py_compile scripts/*.py plugins/topstep-control/__init__.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit verified product change and remove one-shot machinery
        run: |
          rm -f tools/apply_gthp_010.py .github/workflows/apply-gthp-010.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(release): enforce gateway profile compatibility"
          git push origin HEAD:architect/gthp-010-compatibility
