name: profile-release-candidate

on:
  workflow_dispatch:
    inputs:
      evidence_ref:
        description: PRAC or shadow validation evidence reference (URL or docs path)
        required: true
      gateway_commit:
        description: Optional paired gateway commit SHA (recorded in profile-release.json)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-candidate:
    environment: armed-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate distribution integrity and build release artifacts
        env:
          EVIDENCE_REF: ${{ inputs.evidence_ref }}
          GATEWAY_COMMIT: ${{ inputs.gateway_commit }}
        run: |
          set -euo pipefail
          mkdir -p release
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'scripts'); from distribution_manifest import verify_sha256sums; errors=verify_sha256sums(Path('.')); assert not errors, errors"
          python -m unittest discover -s tests -p 'test_*.py'
          PROFILE_VERSION="$(sed -n 's/^version: *["\x27]*\([^"\x27 ]*\).*/\1/p' distribution.yaml)"
          PROMPT_VERSION="$(sed -n 's/^PROMPT_VERSION = ["\x27]*\([^"\x27]*\).*/\1/p' scripts/distribution_manifest.py)"
          SHA256SUMS_SHA256="$(sha256sum SHA256SUMS | cut -d ' ' -f1)"
          export PROFILE_VERSION PROMPT_VERSION SHA256SUMS_SHA256
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          owned = [
              "distribution.yaml",
              "SOUL.md",
              "operator.json",
              "config.yaml",
              "setup.ps1",
              "README.md",
              "SHA256SUMS",
          ]
          components = []
          for rel in owned:
              path = Path(rel)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              components.append({
                  "type": "file",
                  "name": rel,
                  "hashes": {"SHA-256": digest},
              })
          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "timestamp": datetime.now(timezone.utc).isoformat(),
                  "component": {
                      "type": "application",
                      "name": "glitch-topstep-hermes-profile",
                      "version": os.environ["PROFILE_VERSION"],
                  },
              },
              "components": components,
          }
          Path("release/profile.cdx.json").write_text(json.dumps(sbom, indent=2) + "\n", encoding="utf-8")
          release = {
              "schema_version": "glitch.topstep.profile_release.v1",
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "immutable": True,
              "armed_promotion_requires_human_approval": True,
              "profile": {
                  "repository": "GlitchTrader/glitch-topstep-hermes-profile",
                  "commit": os.environ["GITHUB_SHA"],
                  "version": os.environ["PROFILE_VERSION"],
                  "prompt_version": os.environ["PROMPT_VERSION"],
                  "sha256sums_sha256": os.environ["SHA256SUMS_SHA256"],
              },
              "paired_gateway_commit": os.environ.get("GATEWAY_COMMIT") or None,
              "validation": {
                  "prac_or_shadow_evidence_ref": os.environ["EVIDENCE_REF"],
              },
          }
          Path("release/profile-release.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(release, indent=2))
          PY
          cp SHA256SUMS release/distribution.SHA256SUMS
          sha256sum release/* > release/SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-release-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 30
