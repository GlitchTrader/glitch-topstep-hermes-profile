# One-shot implementation workflow; it deletes itself after the verified commit.
name: Apply RAIL-006 frame lookup consolidation

on:
  push:
    branches:
      - refactor/rail-006-frame-lookup

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/rail-006-frame-lookup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consolidate the lookup helper
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          parity_path = Path("scripts/parity.py")
          parity = parity_path.read_text(encoding="utf-8")
          old = '''def packet_for_outbox_id(state: Path, packet_id: str) -> dict[str, Any] | None:
              # ponytail: O(n) scan over minute-frames; fine at typical retention sizes
              frames_dir = state / "minute-frames"
              if not frames_dir.is_dir():
                  return None
              for path in frames_dir.glob("*.json"):
                  frame = read_optional_json(path)
                  if not frame:
                      continue
                  packet = frame.get("packet")
                  if isinstance(packet, dict) and str(packet.get("packet_id") or "") == packet_id:
                      return packet
              return None
          '''.replace("          ", "")
          new = '''def frame_for_packet_id(frames_root: Path, packet_id: str) -> dict[str, Any] | None:
              # O(n) over the bounded minute-frame retention; no index is warranted here.
              if not frames_root.is_dir():
                  return None
              for path in frames_root.glob("*.json"):
                  frame = read_optional_json(path)
                  if not isinstance(frame, dict):
                      continue
                  packet = frame.get("packet")
                  if isinstance(packet, dict) and str(packet.get("packet_id") or "") == packet_id:
                      return frame
              return None


          def packet_for_outbox_id(state: Path, packet_id: str) -> dict[str, Any] | None:
              frame = frame_for_packet_id(state / "minute-frames", packet_id)
              packet = frame.get("packet") if isinstance(frame, dict) else None
              return packet if isinstance(packet, dict) else None
          '''.replace("          ", "")
          if parity.count(old) != 1:
              raise SystemExit("expected one packet_for_outbox_id implementation")
          parity_path.write_text(parity.replace(old, new), encoding="utf-8")

          learning_path = Path("scripts/run-topstep-learning.py")
          learning = learning_path.read_text(encoding="utf-8")
          import_old = '''from parity import (
              PROMPT_VERSION,
              classify_delivery_result,
              debrief_evidence,
              suggest_flat_abstention_classification,
          )
          '''.replace("          ", "")
          import_new = '''from parity import (
              PROMPT_VERSION,
              classify_delivery_result,
              debrief_evidence,
              frame_for_packet_id,
              suggest_flat_abstention_classification,
          )
          '''.replace("          ", "")
          local = '''def frame_for_packet_id(frames_root: Path, packet_id: str) -> dict[str, Any] | None:
              for path in sorted(frames_root.glob("*.json")):
                  frame = read_optional_json(path)
                  if not isinstance(frame, dict):
                      continue
                  packet = frame.get("packet")
                  if isinstance(packet, dict) and str(packet.get("packet_id") or "") == packet_id:
                      return frame
              return None


          '''.replace("          ", "")
          if learning.count(import_old) != 1 or learning.count(local) != 1:
              raise SystemExit("expected one learning import and local frame helper")
          learning = learning.replace(import_old, import_new).replace(local, "")
          learning_path.write_text(learning, encoding="utf-8")

          ledger_path = Path("docs/ledger/ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          row = next(item for item in ledger["items"] if item["id"] == "RAIL-006")
          row["status"] = "done"
          row["evidence"] = [
              "scripts/parity.py owns the single packet-ID to minute-frame scan; packet_for_outbox_id is a compatibility projection.",
              "scripts/run-topstep-learning.py imports the shared frame helper.",
              "tests/test_frame_lookup.py plus the full profile suite pass."
          ]
          ledger["updated"] = "2026-08-02"
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Verify profile contracts
        run: |
          python -m py_compile scripts/*.py plugins/topstep-control/__init__.py
          python -m unittest discover -s tests -p 'test_*.py'
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('docs/ledger/ledger.json').read_text(encoding='utf-8'))
          PY
      - name: Commit the verified consolidation and remove this one-shot workflow
        run: |
          rm .github/workflows/rail-006-apply.yml
          git config user.name "glitch-profile-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/parity.py scripts/run-topstep-learning.py tests/test_frame_lookup.py docs/ledger/ledger.json .github/workflows/rail-006-apply.yml
          git commit -m "refactor(profile): consolidate packet frame lookup"
          git push origin HEAD:refactor/rail-006-frame-lookup
