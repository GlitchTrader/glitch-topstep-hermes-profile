model:
  default: nvidia/nemotron-3-ultra-550b-a55b:free
  provider: openrouter
fallback_providers:
  - provider: openrouter
    model: openrouter/free
agent:
  reasoning_overrides:
    gpt-5.6-sol: high
  reasoning_effort: medium
terminal:
  backend: local
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
skills:
  inline_shell: false
sessions:
  auto_prune: false
_config_version: 33
plugins:
  enabled:
    - topstep-control
  disabled: []
  entries:
    topstep-control:
      allow_tool_override: false
onboarding:
  seen:
    tool_progress_prompt: true
